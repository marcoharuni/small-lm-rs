name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Install environment
        run: uv sync --locked --all-groups
      - name: Ruff
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Mypy
        run: uv run --frozen mypy
      - name: Pytest
        env:
          JAX_PLATFORM_NAME: cpu
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: uv run --frozen pytest

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets

  rust:
    name: Rust + end-to-end inference
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Verify bundled artifact hashes
        run: |
          cd artifacts/small-lm-8m
          sha256sum -c SHA256SUMS
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: JAX-Rust parity
        run: cargo run --quiet --release -p smalllm-engine --example parity -- artifacts/small-lm-8m
      - name: OpenAI-compatible server smoke test
        run: bash scripts/smoke_server.sh artifacts/small-lm-8m
      - name: Continuous batching benchmark
        if: github.event_name == 'pull_request' && github.head_ref == 'perf-roadmap'
        env:
          SMALLLM_BENCH_MAX_TOKENS: "8"
          SMALLLM_BENCH_ROUNDS: "3"
        run: python3 scripts/benchmark_concurrency.py artifacts/small-lm-8m
      - name: Install uv for M6 benchmark suite
        if: github.event_name == 'pull_request' && github.head_ref == 'milestone-6-benchmarks'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python benchmark dependencies
        if: github.event_name == 'pull_request' && github.head_ref == 'milestone-6-benchmarks'
        run: uv sync --locked --all-groups
      - name: Full M6 benchmark suite
        if: github.event_name == 'pull_request' && github.head_ref == 'milestone-6-benchmarks'
        env:
          SMALLLM_BENCH_HTTP: "1"
          SMALLLM_BENCH_ITERATIONS: "10"
          SMALLLM_BENCH_MAX_TOKENS: "8"
          SMALLLM_BENCH_ROUNDS: "3"
        run: bash scripts/benchmark_suite.sh artifacts/small-lm-8m
      - name: Upload M6 benchmark outputs
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'milestone-6-benchmarks'
        uses: actions/upload-artifact@v4
        with:
          name: m6-benchmark-results
          path: benchmarks/runs/
          if-no-files-found: error
