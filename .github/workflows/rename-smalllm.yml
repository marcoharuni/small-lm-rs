name: smallLM naming migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-smalllm.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt, clippy

      - name: Rename and clean branding
        shell: bash
        run: |
          set -euo pipefail

          git mv src/nilemini src/smalllm
          git mv configs/training/onehour_probe.json configs/training/probe_l4.json
          git mv configs/training/onehour_final.json configs/training/final_l4.json
          git mv configs/training/onehour_sft.json configs/training/final_sft_l4.json

          python - <<'PY'
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          replacements = [
              ("artifacts/nilemini-8m-situ", "artifacts/small-lm-8m"),
              ("/root/nilemini-rs", "/root/small-lm-rs"),
              ("nilemini-v1", "smallLM-v01"),
              ("onehour-8m-probe", "smallLM-8m-probe"),
              ("onehour-8m-final", "smallLM-8m-final"),
              ("onehour-8m-sft", "smallLM-8m-sft"),
              ("prepare-onehour-probe", "prepare-probe"),
              ("prepare-onehour-final", "prepare-final"),
              ("prepare-onehour-sft", "prepare-final-sft"),
              ("onehour-export", "final-export"),
              ("onehour-probe", "probe"),
              ("onehour-final", "final"),
              ("onehour-sft", "final-sft"),
              ("onehour_probe.json", "probe_l4.json"),
              ("onehour_final.json", "final_l4.json"),
              ("onehour_sft.json", "final_sft_l4.json"),
              ("onehour_probe", "probe_l4"),
              ("onehour_final", "final_l4"),
              ("onehour_sft", "final_sft_l4"),
              ("One-hour 8M probe", "8M probe"),
              ("One-hour", "Timed"),
              ("NileMiniModel", "SmallLMModel"),
              ("NileTokenizer", "SmallLMTokenizer"),
              ("NILEMINI", "SMALLLM"),
              ("NileMini", "SmallLM"),
              ("nilemini_engine", "smalllm_engine"),
              ("nilemini-engine", "smalllm-engine"),
              ("nilemini-server", "smalllm-server"),
              ("nilemini", "smalllm"),
          ]

          changed = []
          for raw_path in paths:
              path = Path(raw_path)
              if not path.is_file() or raw_path.startswith(".github/workflows/"):
                  continue
              data = path.read_bytes()
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(raw_path)

          for raw_path in ["README.md", "docs/TRAINING.md", "docs/MODAL_TRAINING.md", "configs/README.md"]:
              path = Path(raw_path)
              if path.exists():
                  text = path.read_text(encoding="utf-8")
                  text = text.replace("SmallLM", "smallLM")
                  path.write_text(text, encoding="utf-8")

          print(f"updated {len(changed)} text files")
          for path in changed:
              print(path)
          PY

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          artifact = Path("artifacts/small-lm-8m")
          weights = artifact / "model.safetensors"
          data = weights.read_bytes()
          old = b"nilemini-v1"
          new = b"smallLM-v01"
          count = data.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one legacy SafeTensors metadata marker, found {count}")
          weights.write_bytes(data.replace(old, new))

          files = sorted(
              p for p in artifact.iterdir()
              if p.is_file() and p.name not in {"manifest.json", "SHA256SUMS"}
          )
          hashes = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          manifest_path = artifact / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["files"] = hashes
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (artifact / "SHA256SUMS").write_text(
              "\n".join(f"{digest}  {name}" for name, digest in sorted(hashes.items())) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Refresh Python lockfile
        run: uv lock

      - name: Verify legacy names outside workflows are gone
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -inE 'nilemini|onehour|one-hour' -- ':!.github/workflows/*'; then
            echo 'legacy text naming remains outside workflows' >&2
            exit 1
          fi
          if grep -a -iE 'nilemini|onehour|one-hour' artifacts/small-lm-8m/model.safetensors; then
            echo 'legacy naming remains in model.safetensors metadata' >&2
            exit 1
          fi
          if git ls-files | grep -v '^.github/workflows/' | grep -iE 'nilemini|onehour|one-hour'; then
            echo 'legacy naming remains in a tracked path outside workflows' >&2
            exit 1
          fi

      - name: Python checks
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --all-groups
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy
          JAX_PLATFORM_NAME=cpu XLA_PYTHON_CLIENT_PREALLOCATE=false uv run --frozen pytest

      - name: Rust checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Artifact and end-to-end checks
        run: bash scripts/check.sh

      - name: Commit non-workflow migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Standardize smallLM naming'
          git push origin HEAD:main
