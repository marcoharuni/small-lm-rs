<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NileMini</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(720px, calc(100% - 24px));
      margin: 28px auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 10px;
      border-bottom: 1px solid #d8d8d8;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    #status {
      font-size: 13px;
      color: #777;
    }

    #status.ready { color: #247a3c; }

    #chat {
      min-height: 140px;
      max-height: 52vh;
      overflow-y: auto;
      padding: 18px 0 6px;
    }

    .empty {
      color: #888;
      font-size: 14px;
      padding: 8px 0 18px;
    }

    .message {
      margin-bottom: 18px;
      line-height: 1.5;
      font-size: 15px;
    }

    .message strong {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .message.user strong { color: #555; }
    .message.assistant strong { color: #1769aa; }

    .text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .error { color: #a22222; }

    .composer {
      border-top: 1px solid #d8d8d8;
      padding-top: 12px;
    }

    textarea {
      width: 100%;
      min-height: 70px;
      resize: vertical;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: #fff;
      color: #222;
      font: inherit;
      outline: none;
    }

    textarea:focus { border-color: #777; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .settings {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      color: #666;
    }

    input[type="number"] {
      width: 66px;
      padding: 6px;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: #fff;
      color: #222;
      font: inherit;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 8px 14px;
      border: 1px solid #aaa;
      border-radius: 4px;
      background: #fff;
      color: #222;
      font: inherit;
      cursor: pointer;
    }

    button:hover { background: #eee; }
    button:disabled { opacity: 0.55; cursor: default; }

    #send {
      border-color: #222;
      background: #222;
      color: #fff;
    }

    #send:hover { background: #444; }

    .note {
      margin-top: 9px;
      color: #999;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .page { margin-top: 14px; }
      #chat { min-height: 120px; max-height: 48vh; }
      .toolbar { align-items: flex-end; }
      .settings { gap: 7px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>NileMini</h1>
      <span id="status">checking...</span>
    </header>

    <section id="chat">
      <div id="empty" class="empty">Start a conversation.</div>
    </section>

    <section class="composer">
      <textarea id="prompt" placeholder="Type a message..." autofocus></textarea>

      <div class="toolbar">
        <div class="settings">
          <label>
            Tokens
            <input id="maxTokens" type="number" min="1" max="128" step="1" value="32">
          </label>
          <label>
            Temp
            <input id="temperature" type="number" min="0" max="2" step="0.1" value="0">
          </label>
        </div>

        <div class="buttons">
          <button id="clear" type="button">Clear</button>
          <button id="send" type="button">Send</button>
        </div>
      </div>

      <div class="note">NileMini-8M-SiTU · local Rust inference</div>
    </section>
  </main>

  <script>
    const chat = document.getElementById('chat');
    const prompt = document.getElementById('prompt');
    const send = document.getElementById('send');
    const clear = document.getElementById('clear');
    const status = document.getElementById('status');
    const maxTokens = document.getElementById('maxTokens');
    const temperature = document.getElementById('temperature');

    let model = 'nilemini-8m-situ';
    let messages = [];

    function addMessage(role, content) {
      document.getElementById('empty')?.remove();

      const item = document.createElement('div');
      item.className = `message ${role}`;

      const label = document.createElement('strong');
      label.textContent = role === 'user' ? 'You' : 'NileMini';

      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = content;

      item.append(label, text);
      chat.appendChild(item);
      chat.scrollTop = chat.scrollHeight;
      return text;
    }

    async function checkHealth() {
      try {
        const response = await fetch('/health');
        const data = await response.json();
        if (!response.ok || !data.ready) throw new Error();
        model = data.model || model;
        status.textContent = 'ready';
        status.classList.add('ready');
      } catch {
        status.textContent = 'offline';
        status.classList.remove('ready');
      }
    }

    async function submit() {
      const content = prompt.value.trim();
      if (!content || send.disabled) return;

      messages.push({ role: 'user', content });
      addMessage('user', content);
      prompt.value = '';

      send.disabled = true;
      clear.disabled = true;
      send.textContent = 'Wait...';
      const answer = addMessage('assistant', '...');

      try {
        const tokens = Math.max(1, Math.min(128, Number(maxTokens.value) || 32));
        const temp = Math.max(0, Math.min(2, Number(temperature.value) || 0));

        const response = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model,
            messages,
            max_tokens: tokens,
            temperature: temp,
            top_p: 1.0,
            top_k: 0,
            seed: 0
          })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data?.error?.message || `HTTP ${response.status}`);
        }

        const content = data?.choices?.[0]?.message?.content || '(empty response)';
        answer.textContent = content;
        messages.push({ role: 'assistant', content });
      } catch (error) {
        answer.textContent = `Error: ${error.message}`;
        answer.classList.add('error');
        messages.pop();
      } finally {
        send.disabled = false;
        clear.disabled = false;
        send.textContent = 'Send';
        prompt.focus();
      }
    }

    send.addEventListener('click', submit);

    clear.addEventListener('click', () => {
      messages = [];
      chat.innerHTML = '<div id="empty" class="empty">Start a conversation.</div>';
      prompt.focus();
    });

    prompt.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        submit();
      }
    });

    checkHealth();
  </script>
</body>
</html>
