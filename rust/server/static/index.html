<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>NileMini-8M-SiTU</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #edf2f7;
      background: #07111f;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(35, 103, 160, 0.22), transparent 34rem),
        radial-gradient(circle at 100% 100%, rgba(54, 153, 126, 0.14), transparent 30rem),
        #07111f;
    }

    button, textarea, input { font: inherit; }

    .shell {
      width: min(980px, calc(100% - 28px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 26px 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
    }

    header, .chat, .composer {
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(8, 20, 35, 0.84);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(18px);
    }

    header {
      border-radius: 22px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand { display: flex; align-items: center; gap: 13px; }

    .mark {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: #07111f;
      background: linear-gradient(135deg, #7dd3fc, #6ee7b7);
    }

    h1 { margin: 0; font-size: 1.03rem; letter-spacing: -0.01em; }
    .subtitle { margin-top: 4px; color: #8ea0b7; font-size: 0.82rem; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #aab8c8;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.65);
    }

    .status.ready .dot {
      background: #34d399;
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.65);
    }

    .chat {
      min-height: 52vh;
      max-height: calc(100vh - 280px);
      overflow: auto;
      border-radius: 22px;
      padding: 24px;
      scroll-behavior: smooth;
    }

    .welcome {
      min-height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      color: #9aacc1;
      padding: 40px 18px;
    }

    .welcome strong {
      display: block;
      color: #e7eef6;
      font-size: clamp(1.3rem, 3vw, 2rem);
      margin-bottom: 10px;
    }

    .welcome span { display: block; max-width: 520px; line-height: 1.6; }

    .message {
      display: flex;
      margin: 0 0 18px;
    }

    .message.user { justify-content: flex-end; }

    .bubble {
      max-width: min(760px, 88%);
      padding: 13px 15px;
      border-radius: 17px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assistant .bubble {
      background: #102238;
      border: 1px solid rgba(125, 211, 252, 0.13);
      border-top-left-radius: 5px;
    }

    .user .bubble {
      color: #05111d;
      background: linear-gradient(135deg, #8bdcf9, #83e5c2);
      border-top-right-radius: 5px;
    }

    .meta {
      color: #6f8198;
      font-size: 0.72rem;
      margin-top: -10px;
      margin-bottom: 18px;
    }

    .composer {
      border-radius: 22px;
      padding: 14px;
    }

    textarea {
      width: 100%;
      resize: none;
      min-height: 58px;
      max-height: 180px;
      border: 0;
      outline: 0;
      color: #eef4fa;
      background: transparent;
      padding: 8px 9px 12px;
      line-height: 1.45;
    }

    textarea::placeholder { color: #66778d; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
      padding-top: 12px;
    }

    .settings { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }

    label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #8092a8;
      font-size: 0.75rem;
    }

    input[type="number"] {
      width: 64px;
      color: #dce6ef;
      background: #0b1a2b;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 9px;
      padding: 6px 7px;
      outline: 0;
    }

    .actions { display: flex; gap: 8px; }

    button {
      border: 0;
      cursor: pointer;
      border-radius: 11px;
      padding: 9px 13px;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: 0.55; transform: none; }

    .secondary {
      color: #aab8c8;
      background: #102238;
    }

    .primary {
      font-weight: 700;
      color: #05111d;
      background: linear-gradient(135deg, #8bdcf9, #83e5c2);
    }

    .error { color: #fda4af; }

    @media (max-width: 640px) {
      .shell { width: min(100% - 16px, 980px); padding: 8px 0; gap: 8px; }
      header, .chat, .composer { border-radius: 16px; }
      header { padding: 14px; }
      .subtitle { display: none; }
      .chat { padding: 15px; max-height: calc(100vh - 230px); }
      .controls { align-items: flex-end; }
      .settings label:nth-child(2) { display: none; }
      .bubble { max-width: 94%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="mark">N</div>
        <div>
          <h1>NileMini-8M-SiTU</h1>
          <div class="subtitle">7,999,744 parameters · Rust CPU inference</div>
        </div>
      </div>
      <div id="status" class="status">
        <span class="dot"></span>
        <span id="statusText">Checking model…</span>
      </div>
    </header>

    <section id="chat" class="chat" aria-live="polite">
      <div id="welcome" class="welcome">
        <div>
          <strong>Chat with NileMini</strong>
          <span>This is the locally served 8M-parameter model. It is intentionally small, so expect compact and sometimes imperfect answers.</span>
        </div>
      </div>
    </section>

    <section class="composer">
      <textarea id="prompt" rows="2" maxlength="4000" placeholder="Message NileMini…" aria-label="Message"></textarea>
      <div class="controls">
        <div class="settings">
          <label>Tokens <input id="maxTokens" type="number" min="1" max="128" value="32" /></label>
          <label>Temperature <input id="temperature" type="number" min="0" max="2" step="0.1" value="0" /></label>
        </div>
        <div class="actions">
          <button id="clear" class="secondary" type="button">Clear</button>
          <button id="send" class="primary" type="button">Send</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const chat = document.querySelector('#chat');
    const welcome = document.querySelector('#welcome');
    const prompt = document.querySelector('#prompt');
    const send = document.querySelector('#send');
    const clear = document.querySelector('#clear');
    const maxTokens = document.querySelector('#maxTokens');
    const temperature = document.querySelector('#temperature');
    const status = document.querySelector('#status');
    const statusText = document.querySelector('#statusText');

    let model = 'nilemini-8m-situ';
    let messages = [];

    function appendMessage(role, content) {
      welcome?.remove();
      const row = document.createElement('div');
      row.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = content;
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    function appendMeta(text, isError = false) {
      const meta = document.createElement('div');
      meta.className = `meta${isError ? ' error' : ''}`;
      meta.textContent = text;
      chat.appendChild(meta);
      chat.scrollTop = chat.scrollHeight;
    }

    async function checkHealth() {
      try {
        const response = await fetch('/health');
        const data = await response.json();
        if (!response.ok || !data.ready) throw new Error('Model is not ready');
        model = data.model || model;
        status.classList.add('ready');
        statusText.textContent = `${model} ready`;
      } catch (error) {
        status.classList.remove('ready');
        statusText.textContent = 'Model unavailable';
      }
    }

    async function submit() {
      const text = prompt.value.trim();
      if (!text || send.disabled) return;

      const userMessage = { role: 'user', content: text };
      messages.push(userMessage);
      appendMessage('user', text);
      prompt.value = '';
      prompt.style.height = 'auto';

      send.disabled = true;
      clear.disabled = true;
      send.textContent = 'Thinking…';
      const pending = appendMessage('assistant', '…');

      try {
        const response = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model,
            messages,
            max_tokens: Math.max(1, Math.min(128, Number(maxTokens.value) || 32)),
            temperature: Math.max(0, Number(temperature.value) || 0),
            top_p: 1.0,
            top_k: 0,
            seed: 0
          })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data?.error?.message || `HTTP ${response.status}`);
        }

        const content = data?.choices?.[0]?.message?.content ?? '';
        pending.textContent = content || '(empty response)';
        messages.push({ role: 'assistant', content });

        if (data.usage) {
          appendMeta(`prompt ${data.usage.prompt_tokens} · completion ${data.usage.completion_tokens} · total ${data.usage.total_tokens} tokens`);
        }
      } catch (error) {
        pending.textContent = `Request failed: ${error.message}`;
        pending.classList.add('error');
        messages.pop();
      } finally {
        send.disabled = false;
        clear.disabled = false;
        send.textContent = 'Send';
        prompt.focus();
      }
    }

    send.addEventListener('click', submit);

    clear.addEventListener('click', () => {
      messages = [];
      chat.innerHTML = '<div id="welcome" class="welcome"><div><strong>New conversation</strong><span>Send a message to start chatting with NileMini.</span></div></div>';
      prompt.focus();
    });

    prompt.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        submit();
      }
    });

    prompt.addEventListener('input', () => {
      prompt.style.height = 'auto';
      prompt.style.height = `${Math.min(prompt.scrollHeight, 180)}px`;
    });

    checkHealth();
    prompt.focus();
  </script>
</body>
</html>
